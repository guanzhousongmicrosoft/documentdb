name: DocumentDB functional tests
run-name: ${{ github.event_name == 'schedule' && 'daily functional tests (all tests)' || github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}

concurrency:
  group: functional-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - "main"
    paths-ignore:
      - ".devcontainer/**"
      - "**/*.md"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - ".devcontainer/**"
      - "**/*.md"

permissions:
  actions: read
  contents: read

env:
  FUNCTIONAL_TESTS_COMPOSE_PATH: scripts/functional_tests/docker-compose.yml
  PG_VERSION: "17"
  PACKAGE_OUTPUT_DIR: downloaded-artifacts
  COMPOSE_PROJECT_NAME: documentdb-functional-tests-${{ github.run_id }}-${{ github.run_attempt }}
  DOCUMENTDB_IMAGE: documentdb-local-ci:${{ github.run_id }}-${{ github.run_attempt }}
  DOCDB_USERNAME: docdb_user
  DOCDB_PASSWORD: DocDB_${{ github.run_id }}_${{ github.run_attempt }}
  TEST_IMAGE_PIN_FILE: scripts/functional_tests/test-image-pin.txt
  TEST_RESULTS_DIR: ${{ github.workspace }}/functional-test-results
  DAILY_BASELINE_ARTIFACT_NAME: functional-test-daily-baseline-pg17

jobs:
  functional-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    name: Functional tests (documentdb-local PG17)
    env:
      EXCLUDE_DESELECT_FILE: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
      TEST_SCOPE: full
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Mask ephemeral test credentials
        shell: bash
        run: echo "::add-mask::${{ env.DOCDB_PASSWORD }}"

      - name: Resolve test image
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh resolve-functional-test-image --pin-file "${{ env.TEST_IMAGE_PIN_FILE }}" --github-env "$GITHUB_ENV"

      - name: Run functional test stack
        id: run_stack
        uses: ./.github/actions/run-functional-test-stack
        with:
          logs_dir: ${{ runner.temp }}/documentdb-local-logs
          pg_version: ${{ env.PG_VERSION }}
          package_output_dir: ${{ env.PACKAGE_OUTPUT_DIR }}
          documentdb_image: ${{ env.DOCUMENTDB_IMAGE }}
          test_image: ${{ env.TEST_IMAGE }}
          results_dir: ${{ env.TEST_RESULTS_DIR }}
          username: ${{ env.DOCDB_USERNAME }}
          password: ${{ env.DOCDB_PASSWORD }}
          scope: ${{ env.TEST_SCOPE }}
          exclude_deselect_file: ${{ github.event_name == 'schedule' && 'true' || 'false' }}

      - name: Download latest daily baseline
        if: always() && steps.run_stack.outputs.report_valid == 'true'
        id: download_daily_baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh download-daily-baseline --event-name "${{ github.event_name }}" --repository "${{ github.repository }}" --artifact-name "${{ env.DAILY_BASELINE_ARTIFACT_NAME }}" --output-dir "${{ runner.temp }}/daily-baseline" --github-output "$GITHUB_OUTPUT" --server-url "${{ github.server_url }}"

      - name: Analyze functional test results
        if: always() && steps.run_stack.outputs.report_valid == 'true'
        id: analyze_results
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh analyze-results --report "${{ env.TEST_RESULTS_DIR }}/functional-report.json" --deselect-list scripts/functional_tests/deselect.list --analysis-json "${{ runner.temp }}/functional-test-analysis.json" --summary-markdown "${{ runner.temp }}/functional-test-summary.md" --scope "${{ env.TEST_SCOPE }}" --deselect-mode "${{ github.event_name == 'schedule' && 'excluded' || 'applied' }}" --documentdb-image "${{ env.DOCUMENTDB_IMAGE }}" --test-image "${{ env.TEST_IMAGE }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --baseline-input "${{ steps.download_daily_baseline.outputs.baseline_path }}" --baseline-output "${{ github.event_name == 'schedule' && format('{0}/functional-test-daily-baseline.json', runner.temp) || '' }}" --github-output "$GITHUB_OUTPUT"

      - name: Upload raw test results
        if: always() && steps.run_stack.outputs.results_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-test-results-pg${{ env.PG_VERSION }}
          overwrite: true
          path: |
            ${{ env.TEST_RESULTS_DIR }}/functional-report.json
            ${{ env.TEST_RESULTS_DIR }}/functional-results.xml
          if-no-files-found: error

      - name: Upload test analysis
        if: always() && steps.analyze_results.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: functional-test-analysis-pg${{ env.PG_VERSION }}
          overwrite: true
          path: |
            ${{ steps.analyze_results.outputs.analysis_json }}
            ${{ steps.analyze_results.outputs.summary_markdown }}
          if-no-files-found: error

      - name: Upload daily baseline
        if: always() && steps.analyze_results.outputs.baseline_output != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.DAILY_BASELINE_ARTIFACT_NAME }}
          overwrite: true
          path: ${{ steps.analyze_results.outputs.baseline_output }}
          if-no-files-found: error

      - name: Generate test summary
        if: steps.analyze_results.outcome == 'success'
        shell: bash
        run: cat "${{ steps.analyze_results.outputs.summary_markdown }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce functional test outcome
        if: always()
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh enforce-stack-outcome --build-success "${{ steps.run_stack.outputs.build_success }}" --test-exit-code "${{ steps.run_stack.outputs.test_exit_code }}" --report-valid "${{ steps.run_stack.outputs.report_valid }}"

      - name: Cleanup functional test stack
        if: always()
        uses: ./.github/actions/cleanup-functional-test-stack
        with:
          compose_path: ${{ env.FUNCTIONAL_TESTS_COMPOSE_PATH }}
          project_name: ${{ env.COMPOSE_PROJECT_NAME }}
          logs_dir: ${{ runner.temp }}/documentdb-local-logs
          artifact_name: documentdb-local-logs-pg${{ env.PG_VERSION }}
          cleanup_test_image: ${{ env.TEST_IMAGE }}
          show_docker_log_tail: ${{ failure() && 'true' || 'false' }}
          upload_logs: ${{ failure() && 'true' || 'false' }}
