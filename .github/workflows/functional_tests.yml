name: DocumentDB functional tests
run-name: ${{ github.event.pull_request.title || github.ref_name }}

concurrency:
  group: functional-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths-ignore:
      - ".devcontainer/**"
      - "*.md"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - ".devcontainer/**"
      - "*.md"

permissions:
  contents: read

env:
  FUNCTIONAL_TESTS_COMPOSE_PATH: scripts/functional_tests/docker-compose.yml
  PG_VERSION: "17"
  PACKAGE_OUTPUT_DIR: downloaded-artifacts
  COMPOSE_PROJECT_NAME: documentdb-functional-tests-${{ github.run_id }}-${{ github.run_attempt }}
  DOCUMENTDB_IMAGE: documentdb-local-ci:${{ github.run_id }}-${{ github.run_attempt }}
  DOCDB_USERNAME: docdb_user
  DOCDB_PASSWORD: DocDB_${{ github.run_id }}_${{ github.run_attempt }}
  TEST_IMAGE: ghcr.io/documentdb/functional-tests:latest
  TEST_RESULTS_DIR: ${{ github.workspace }}/functional-test-results

jobs:
  functional-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    name: Functional tests (documentdb-local PG17)
    env:
      TEST_SCOPE: full
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build local documentdb-local image
        id: build_documentdb_local
        shell: bash
        run: |
          set -euo pipefail
          logs_dir="${{ runner.temp }}/documentdb-local-logs"
          build_log="${logs_dir}/build.log"
          mkdir -p "${logs_dir}"

          echo "Building ${DOCUMENTDB_IMAGE}; full output is being captured to ${build_log}."
          set +e
          bash ./scripts/functional_tests/run_with_compose.sh build \
            --pg "${{ env.PG_VERSION }}" \
            --output-dir "${{ env.PACKAGE_OUTPUT_DIR }}" \
            --documentdb-image "${{ env.DOCUMENTDB_IMAGE }}" \
            2>&1 | tee "${build_log}"
          exit_code=${PIPESTATUS[0]}
          set -e

          if [ "${exit_code}" -eq 0 ]; then
            echo "Build completed."
          fi
          exit "${exit_code}"

      - name: Run functional tests with Docker Compose
        id: run_functional_tests
        shell: bash
        run: |
          set -euo pipefail
          logs_dir="${{ runner.temp }}/documentdb-local-logs"
          test_log="${logs_dir}/test.log"
          mkdir -p "${logs_dir}"

          echo "Running functional tests; full output is being captured to ${test_log}."
          set +e
          bash ./scripts/functional_tests/run_with_compose.sh test \
            --pg "${{ env.PG_VERSION }}" \
            --output-dir "${{ env.PACKAGE_OUTPUT_DIR }}" \
            --documentdb-image "${{ env.DOCUMENTDB_IMAGE }}" \
            --test-image "${{ env.TEST_IMAGE }}" \
            --results-dir "${{ env.TEST_RESULTS_DIR }}" \
            --username "${{ env.DOCDB_USERNAME }}" \
            --password "${{ env.DOCDB_PASSWORD }}" \
            --scope "${{ env.TEST_SCOPE }}" \
            2>&1 | tee "${test_log}"
          exit_code=${PIPESTATUS[0]}
          set -e

          if [ "${exit_code}" -eq 0 ]; then
            echo "Functional test run completed."
          fi
          exit "${exit_code}"

      - name: Verify test results
        id: verify_test_results
        if: always() && steps.build_documentdb_local.outcome == 'success' && steps.run_functional_tests.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          echo "results_ready=false" >> "$GITHUB_OUTPUT"

          missing_results=false
          for required_file in functional-report.json functional-results.xml; do
            if [ ! -f "${{ env.TEST_RESULTS_DIR }}/$required_file" ]; then
              echo "Missing expected test result file: ${{ env.TEST_RESULTS_DIR }}/$required_file" >&2
              missing_results=true
            fi
          done

          if [ "$missing_results" = true ]; then
            echo "Functional tests did not produce the expected result files. Check the test container output for the earlier failure." >&2
            exit 1
          fi
          echo "results_ready=true" >> "$GITHUB_OUTPUT"
          find "${{ env.TEST_RESULTS_DIR }}" -maxdepth 1 -type f | sort

      - name: Upload test results
        if: always() && steps.verify_test_results.outputs.results_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results-pg${{ env.PG_VERSION }}
          overwrite: true
          path: |
            ${{ env.TEST_RESULTS_DIR }}/functional-report.json
            ${{ env.TEST_RESULTS_DIR }}/functional-results.xml
          if-no-files-found: error

      - name: Generate test summary
        if: always() && steps.verify_test_results.outputs.results_ready == 'true'
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["TEST_RESULTS_DIR"]) / "functional-report.json"
          print("## Functional Tests")
          print()
          print(f"Scope: `{os.environ['TEST_SCOPE']}`")
          print(f"System under test: `{os.environ['DOCUMENTDB_IMAGE']}`")
          print(f"Test image: `{os.environ['TEST_IMAGE']}`")
          print()

          if not report_path.exists():
              print("No JSON report was generated.")
              raise SystemExit(0)

          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
          except (json.JSONDecodeError, UnicodeDecodeError) as exc:
              print(f"JSON report exists but could not be parsed: {exc}")
              raise SystemExit(0)
          except OSError as exc:
              print(f"JSON report could not be read: {exc}")
              raise SystemExit(0)

          summary = report.get("summary", {})
          passed = summary.get("passed", 0)
          failed = summary.get("failed", 0)
          skipped = summary.get("skipped", 0)
          total = passed + failed + skipped

          print("| Total | Passed | Failed | Skipped |")
          print("| --- | --- | --- | --- |")
          print(f"| {total} | {passed} | {failed} | {skipped} |")

          failed_tests = [
              test.get("nodeid", "<unknown>")
              for test in report.get("tests", [])
              if test.get("outcome") == "failed"
          ]
          if failed_tests:
              print()
              print("### Failed tests")
              for name in failed_tests[:20]:
                  print(f"- `{name}`")
              if len(failed_tests) > 20:
                  print(f"- ... and {len(failed_tests) - 20} more")
          PY

      - name: Collect documentdb-local logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/documentdb-local-logs"

          container_id="$(docker compose -f "${{ env.FUNCTIONAL_TESTS_COMPOSE_PATH }}" -p "${{ env.COMPOSE_PROJECT_NAME }}" ps -q documentdb-local || true)"
          if [ -n "$container_id" ]; then
            docker compose -f "${{ env.FUNCTIONAL_TESTS_COMPOSE_PATH }}" -p "${{ env.COMPOSE_PROJECT_NAME }}" logs documentdb-local > "${{ runner.temp }}/documentdb-local-logs/documentdb-local.log" 2>&1 || true
            docker logs "$container_id" > "${{ runner.temp }}/documentdb-local-logs/documentdb-local-container.log" 2>&1 || true
            docker cp "$container_id:/var/log/documentdb/." "${{ runner.temp }}/documentdb-local-logs/" || true
          fi

      - name: Show documentdb-local Docker log tail
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          logs_dir="${{ runner.temp }}/documentdb-local-logs"
          found_log=false

          for log_file in documentdb-local.log documentdb-local-container.log; do
            log_path="${logs_dir}/${log_file}"
            if [ -f "${log_path}" ]; then
              found_log=true
              echo "::group::${log_file} (tail -n 200)"
              tail -n 200 "${log_path}" || true
              echo "::endgroup::"
            fi
          done

          if [ "${found_log}" = false ]; then
            echo "No documentdb-local Docker logs were captured."
          fi

      - name: Cleanup local functional test stack
        id: cleanup_local_stack
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          logs_dir="${{ runner.temp }}/documentdb-local-logs"
          cleanup_log="${logs_dir}/cleanup.log"
          mkdir -p "${logs_dir}"

          echo "Cleaning up local functional test stack; full output is being captured to ${cleanup_log}."
          bash ./scripts/functional_tests/run_with_compose.sh down > "${cleanup_log}" 2>&1
          echo "Cleanup completed."

      - name: Show cleanup log tail
        if: steps.cleanup_local_stack.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cleanup_log="${{ runner.temp }}/documentdb-local-logs/cleanup.log"
          if [ ! -f "${cleanup_log}" ]; then
            echo "No cleanup.log was captured."
            exit 0
          fi

          echo "::group::cleanup.log (tail -n 200)"
          tail -n 200 "${cleanup_log}" || true
          echo "::endgroup::"

      - name: Upload documentdb-local logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: documentdb-local-logs-pg${{ env.PG_VERSION }}
          overwrite: true
          path: ${{ runner.temp }}/documentdb-local-logs/
