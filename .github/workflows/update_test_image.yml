name: Update pinned functional test image

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: update-test-image
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  FUNCTIONAL_TESTS_COMPOSE_PATH: scripts/functional_tests/docker-compose.yml
  PG_VERSION: "17"
  PACKAGE_OUTPUT_DIR: downloaded-artifacts
  COMPOSE_PROJECT_NAME: documentdb-update-test-image-${{ github.run_id }}-${{ github.run_attempt }}
  DOCUMENTDB_IMAGE: documentdb-update-test-image:${{ github.run_id }}-${{ github.run_attempt }}
  DOCDB_USERNAME: docdb_user
  DOCDB_PASSWORD: DocDB_${{ github.run_id }}_${{ github.run_attempt }}
  TEST_IMAGE_PIN_FILE: scripts/functional_tests/test-image-pin.txt
  TEST_RESULTS_DIR: ${{ github.workspace }}/functional-test-results

jobs:
  update-test-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: refs/heads/main

      - name: Mask ephemeral test credentials
        shell: bash
        run: echo "::add-mask::${{ env.DOCDB_PASSWORD }}"

      - name: Resolve current and latest test image
        id: resolve_test_image
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh resolve-update-test-image --pin-file "${{ env.TEST_IMAGE_PIN_FILE }}" --github-output "$GITHUB_OUTPUT" --github-step-summary "$GITHUB_STEP_SUMMARY"

      - name: Run functional test stack
        id: run_stack
        if: steps.resolve_test_image.outputs.pin_changed == 'true'
        uses: ./.github/actions/run-functional-test-stack
        with:
          logs_dir: ${{ runner.temp }}/documentdb-update-test-image-logs
          build_test_image: ${{ steps.resolve_test_image.outputs.current_image }}
          pg_version: ${{ env.PG_VERSION }}
          package_output_dir: ${{ env.PACKAGE_OUTPUT_DIR }}
          documentdb_image: ${{ env.DOCUMENTDB_IMAGE }}
          test_image: ${{ steps.resolve_test_image.outputs.latest_image }}
          results_dir: ${{ env.TEST_RESULTS_DIR }}
          username: ${{ env.DOCDB_USERNAME }}
          password: ${{ env.DOCDB_PASSWORD }}
          scope: full
          exclude_deselect_file: true
          allow_test_exit_code_1: true

      - name: Upload raw test results
        if: always() && steps.run_stack.outputs.results_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-test-image-raw-results
          overwrite: true
          path: |
            ${{ env.TEST_RESULTS_DIR }}/functional-report.json
            ${{ env.TEST_RESULTS_DIR }}/functional-results.xml
          if-no-files-found: error

      - name: Enforce functional test outcome
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true'
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh enforce-stack-outcome --build-success "${{ steps.run_stack.outputs.build_success }}" --test-exit-code "${{ steps.run_stack.outputs.test_exit_code }}" --report-valid "${{ steps.run_stack.outputs.report_valid }}" --allow-test-exit-code-1

      - name: Update deselect list
        id: update_deselect
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true' && steps.run_stack.outputs.report_valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          summary_json="${{ runner.temp }}/update-deselect-summary.json"
          python3 ./scripts/functional_tests/update_deselect.py \
            --report "${{ env.TEST_RESULTS_DIR }}/functional-report.json" \
            --deselect-list scripts/functional_tests/deselect.list \
            --summary-json "${summary_json}"
          echo "summary_json=${summary_json}" >> "$GITHUB_OUTPUT"

      - name: Update pinned test image file
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true' && steps.run_stack.outputs.report_valid == 'true'
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh update-pin-file --pin-file "${{ env.TEST_IMAGE_PIN_FILE }}" --image "${{ steps.resolve_test_image.outputs.latest_image }}"

      - name: Generate PR body
        id: generate_pr_body
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true' && steps.run_stack.outputs.report_valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pr_body_path="${{ runner.temp }}/update-test-image-pr-body.md"
          python3 ./scripts/functional_tests/generate_update_pr_body.py \
            --summary-json "${{ steps.update_deselect.outputs.summary_json }}" \
            --current-image "${{ steps.resolve_test_image.outputs.current_image }}" \
            --latest-image "${{ steps.resolve_test_image.outputs.latest_image }}" \
            --output "${pr_body_path}"
          echo "pr_body_path=${pr_body_path}" >> "$GITHUB_OUTPUT"

      - name: Upload update analysis artifacts
        if: always() && steps.generate_pr_body.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: update-test-image-artifacts
          overwrite: true
          path: |
            ${{ steps.update_deselect.outputs.summary_json }}
            ${{ steps.generate_pr_body.outputs.pr_body_path }}
          if-no-files-found: error

      - name: Create or update pull request
        id: create_pull_request
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true' && steps.run_stack.outputs.report_valid == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh create-or-update-update-test-image-pr --body-file "${{ steps.generate_pr_body.outputs.pr_body_path }}" --github-output "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true' && steps.run_stack.outputs.report_valid == 'true'
        shell: bash
        run: bash ./scripts/functional_tests/workflow_ci.sh write-update-summary --current-image "${{ steps.resolve_test_image.outputs.current_image }}" --latest-image "${{ steps.resolve_test_image.outputs.latest_image }}" --pr-url "${{ steps.create_pull_request.outputs.pr_url }}" --step-summary-file "$GITHUB_STEP_SUMMARY"

      - name: Cleanup functional test stack
        if: always() && steps.resolve_test_image.outputs.pin_changed == 'true'
        uses: ./.github/actions/cleanup-functional-test-stack
        with:
          compose_path: ${{ env.FUNCTIONAL_TESTS_COMPOSE_PATH }}
          project_name: ${{ env.COMPOSE_PROJECT_NAME }}
          logs_dir: ${{ runner.temp }}/documentdb-update-test-image-logs
          artifact_name: update-test-image-logs
          cleanup_test_image: ${{ steps.resolve_test_image.outputs.latest_image }}
          show_docker_log_tail: ${{ job.status == 'failure' && 'true' || 'false' }}
          upload_logs: ${{ job.status == 'failure' && 'true' || 'false' }}
