name: Refresh latest tag timestamp

# This workflow ensures the 'latest' tag stays at the top of GHCR package list
# by re-creating the manifest after the gateway build workflow completes.

on:
  workflow_run:
    workflows: ["Build and push gateway images"]
    types:
      - completed
  workflow_dispatch:

permissions:
  packages: write

env:
  IMAGE_NAME: documentdb-local

jobs:
  refresh-latest:
    name: Refresh 'latest' tag timestamp
    runs-on: ubuntu-22.04
    # Run if manually triggered OR if the build workflow succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
    - name: Wait for GHCR to settle
      run: sleep 60

    - name: Login to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Check if latest tag exists and get source images
      id: check_latest
      run: |
        IMAGE=ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}:latest
        echo "Checking image: $IMAGE"
        
        if ! docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "::warning::No 'latest' tag found to refresh"
          exit 0
        fi
        
        echo "exists=true" >> $GITHUB_OUTPUT
        
        # Get the digests of the platform-specific images from the manifest
        AMD64_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --raw | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')
        ARM64_DIGEST=$(docker buildx imagetools inspect "$IMAGE" --raw | jq -r '.manifests[] | select(.platform.architecture=="arm64") | .digest')
        
        echo "AMD64 digest: $AMD64_DIGEST"
        echo "ARM64 digest: $ARM64_DIGEST"
        
        echo "amd64_digest=$AMD64_DIGEST" >> $GITHUB_OUTPUT
        echo "arm64_digest=$ARM64_DIGEST" >> $GITHUB_OUTPUT

    - name: Re-create and push latest manifest
      if: steps.check_latest.outputs.exists == 'true'
      run: |
        IMAGE=ghcr.io/${{ github.repository }}/${{ env.IMAGE_NAME }}
        AMD64="${IMAGE}@${{ steps.check_latest.outputs.amd64_digest }}"
        ARM64="${IMAGE}@${{ steps.check_latest.outputs.arm64_digest }}"
        
        echo "Re-creating latest manifest from:"
        echo "  AMD64: $AMD64"
        echo "  ARM64: $ARM64"
        
        # Remove any existing manifest to force a fresh creation
        docker manifest rm "${IMAGE}:latest" 2>/dev/null || true
        
        # Create a new manifest - this generates a new digest and timestamp
        docker manifest create "${IMAGE}:latest" \
          --amend "$AMD64" \
          --amend "$ARM64"
        
        docker manifest push "${IMAGE}:latest"
        
        echo "Successfully refreshed latest tag"
